<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Ingreso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f4f6fb;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e7eaf3;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(16, 24, 40, 0.08);
      padding: 28px;
    }

    h1 {
      font-size: 1.4rem;
      color: #1f2937;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 22px;
      font-size: 0.95rem;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 6px;
      color: #374151;
      font-weight: 600;
      font-size: 0.92rem;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.98rem;
      outline: none;
      transition: .2s border-color, .2s box-shadow;
      background: #fff;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, .15);
    }

    .hint {
      font-size: .78rem;
      color: #6b7280;
      margin-top: 5px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #4f46e5;
      cursor: pointer;
      transition: .2s background, .1s transform;
      margin-top: 6px;
    }

    button:hover { background: #4338ca; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .6; cursor: not-allowed; }

    #mensaje {
      display: none;
      margin-top: 14px;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      font-size: .95rem;
    }

    #mensaje.exito {
      display: block;
      background: #ecfdf3;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    #mensaje.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Formulario de Ingreso</h1>
    <p class="subtitle">Completa los datos y envíalos</p>

    <form id="formIngreso" novalidate>
      <div class="form-group">
        <label for="numero">Número</label>
        <input
          type="number"
          id="numero"
          name="numero"
          placeholder="Ej: 12345"
          required
          min="0"
          step="1"
        />
        <p class="hint">Solo números enteros positivos</p>
      </div>

      <div class="form-group">
        <label for="alfanumerico">Alfanumérico</label>
        <input
          type="text"
          id="alfanumerico"
          name="alfanumerico"
          placeholder="Ej: ABC123xyz"
          required
          pattern="[A-Za-z0-9]+"
          title="Solo letras y números"
        />
        <p class="hint">Solo letras y números (sin espacios ni símbolos)</p>
      </div>

      <button type="submit" id="btnEnviar">Guardar en base de datos</button>
    </form>

    <div id="mensaje"></div>
  </main>

  <script>
    const form = document.getElementById('formIngreso');
    const mensaje = document.getElementById('mensaje');
    const btn = document.getElementById('btnEnviar');

    const API_URL = 'http://localhost:3000/guardar';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const numero = document.getElementById('numero').value.trim();
      const alfanumerico = document.getElementById('alfanumerico').value.trim();

      if (!numero || isNaN(numero) || Number(numero) < 0 || !Number.isInteger(Number(numero))) {
        return mostrarMensaje('El número debe ser un entero positivo', 'error');
      }

      if (!/^[A-Za-z0-9]+$/.test(alfanumerico)) {
        return mostrarMensaje('El campo alfanumérico solo admite letras y números', 'error');
      }

      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        const respuesta = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numero: Number(numero), alfanumerico })
        });

        const data = await respuesta.json();

        if (respuesta.ok) {
          form.reset();
          mostrarMensaje('Hemos recibido tu solicitud exitosamente', 'exito');
        } else {
          mostrarMensaje(data.error || 'Error al guardar', 'error');
        }
      } catch (error) {
        mostrarMensaje('No se pudo conectar al servidor. Verifica que el backend esté activo.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar en base de datos';
      }
    });

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = tipo;
    }
  </script>
</body>
</html>
